name: Validate Model Tooling

# Fast checks without Blender: syntax, GLB parser unit tests, and (optionally) validating
# the GLB currently published on the 'model-latest' Release.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/validate-model.yml"]
  workflow_dispatch:
    inputs:
      check_release:
        description: "Also download and structurally check the GLB on the model-latest Release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Unit tests
        run: python3 -m unittest discover tests -v
      - name: Check published GLB
        if: inputs.check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-latest --pattern "*.glb" --dir rel
          for f in rel/*.glb; do python3 scripts/glb_inspect.py "$f"; done
