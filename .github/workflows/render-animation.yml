name: Render Animation Video

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "showcase = one model walks/waves/jumps with captions; rival = Round Buddy trips, Gorilla pounds his chest (no text)"
        type: choice
        options: [showcase, rival]
        default: showcase
      model:
        description: "Published model (used when model_path and model_url are empty)"
        type: choice
        options: [forge-kid, gorilla, round-buddy]
        default: forge-kid
      model_path:
        description: "OR repository path to a .glb/.blend (e.g. assets/my.glb)"
        type: string
        default: ""
      model_url:
        description: "OR https URL of a .glb"
        type: string
        default: ""
      caption:
        description: "Caption words (shown one at a time; '|' separates phrases)"
        type: string
        default: "Meet the Forge crew | walking in | say hello | jump for joy"
      duration:
        description: "Seconds"
        type: string
        default: "8"
      fps:
        type: string
        default: "24"
      resolution:
        description: "WIDTHxHEIGHT (portrait)"
        type: string
        default: "720x1280"
      samples:
        description: "Cycles samples per pixel (CPU)"
        type: string
        default: "16"
  push:
    branches: [main]
    paths: ["animation/**", ".github/workflows/render-animation.yml"]

permissions:
  contents: write   # only to write logs to the ci-results branch (no videos are committed)

concurrency:
  group: render-animation
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"

jobs:
  # CPU Cycles is slow, so frames are split across parallel runners and joined by the encode job.
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        chunk: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and fetch model
        id: cfg
        env:
          MODEL: ${{ inputs.model || 'forge-kid' }}
          MODEL_PATH: ${{ inputs.model_path }}
          MODEL_URL: ${{ inputs.model_url }}
          DURATION: ${{ inputs.duration || '8' }}
          FPS: ${{ inputs.fps || '24' }}
          RES: ${{ inputs.resolution || '720x1280' }}
          SAMPLES: ${{ inputs.samples || '16' }}
          MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: bash animation/resolve_input.sh 2>&1 | tee logs.txt

      - name: Restore cached Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download pinned Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 3 -o "/tmp/$file" "$base/$file"
          mkdir -p ~/blender
          tar -xf "/tmp/$file" -C ~/blender --strip-components=1

      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libegl1 > /dev/null
          ~/blender/blender --version | head -1 | tee -a logs.txt

      - name: Unit tests
        if: matrix.chunk == 0
        run: python3 -m unittest tests.test_timeline -v 2>&1 | tee -a logs.txt

      - name: Build scene and render this chunk (Cycles CPU)
        env:
          CAPTION: ${{ inputs.caption || 'Meet the Forge crew | walking in | say hello | jump for joy' }}
        run: |
          set -euo pipefail
          n=$(python3 -c "print(round(${{ steps.cfg.outputs.fps }}*${{ steps.cfg.outputs.duration }}))")
          per=$(( (n + 3) / 4 )); lo=$(( ${{ matrix.chunk }} * per + 1 )); hi=$(( lo + per - 1 )); (( hi > n )) && hi=$n
          echo "Chunk ${{ matrix.chunk }}: frames $lo-$hi of $n" | tee -a logs.txt
          start=$(date +%s)
          script=animation/make_video.py; EXTRA=""
          if [ "${{ inputs.scene }}" = rival ]; then
            curl -fsSL --retry 3 -o in/gorilla.glb "https://github.com/${{ github.repository }}/releases/download/model-latest/gorilla.glb"
            script=animation/rival_scene.py; EXTRA="--model2 in/gorilla.glb"
          fi
          ~/blender/blender -b --factory-startup --python-exit-code 1 --python "$script" -- \
            --model "${{ steps.cfg.outputs.src }}" --out anim_out --fps ${{ steps.cfg.outputs.fps }} \
            --duration ${{ steps.cfg.outputs.duration }} --width ${{ steps.cfg.outputs.w }} \
            --height ${{ steps.cfg.outputs.h }} --samples ${{ steps.cfg.outputs.samples }} \
            --caption "$CAPTION" --frames "$lo-$hi" $EXTRA 2>&1 | grep -v "^Fra:" | tee -a logs.txt
          echo "Render time chunk ${{ matrix.chunk }}: $(( $(date +%s) - start ))s" | tee -a logs.txt
          got=$(ls anim_out/frames/*.png | wc -l)
          [ "$got" -eq $(( hi - lo + 1 )) ] || { echo "::error::chunk rendered $got frames"; exit 1; }
          # a frame with the character in it is far larger than an empty transparent one
          small=$(find anim_out/frames -name '*.png' -size -3k | wc -l)
          [ "$small" -eq 0 ] || { echo "::error::$small empty-looking frames"; exit 1; }
          mv logs.txt anim_out/logs-${{ matrix.chunk }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk }}
          path: anim_out/
          retention-days: 1
          if-no-files-found: error

  encode:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any render chunk failed
        if: needs.render.result != 'success'
        run: echo "::error::render result ${{ needs.render.result }}" && exit 1

      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: anim_out
          merge-multiple: true

      - name: Encode MP4 (H.264, yuv420p, faststart) and preview
        env:
          CAPTION: ${{ inputs.caption || 'Meet the Forge crew | walking in | say hello | jump for joy' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          cat anim_out/logs-*.txt > logs.txt
          fps=$(python3 -c "import json;print(json.load(open('anim_out/scene_check.json'))['fps'])")
          n=$(python3 -c "import json;print(json.load(open('anim_out/scene_check.json'))['frames'])")
          h=$(head -c 20 anim_out/background.ppm | awk 'NR==1{print $3}')
          dur=$(python3 -c "print($n/$fps)")
          got=$(ls anim_out/frames/*.png | wc -l)
          echo "Frames: $got / $n" | tee -a logs.txt
          [ "$got" -eq "$n" ] || { echo "::error::frame count mismatch"; exit 1; }
          [ "${{ inputs.scene }}" = rival ] && CAPTION=""   # the rival scene has no text
          caps=$(python3 animation/timeline.py --caption "$CAPTION" --duration "$dur" --height "$h")
          mkdir -p video
          ffmpeg -v error -y -framerate "$fps" -i anim_out/frames/%04d.png -loop 1 -framerate "$fps" -i anim_out/background.ppm \
            -filter_complex "[1:v][0:v]overlay=shortest=1,${caps},format=yuv420p[v]" -map "[v]" \
            -c:v libx264 -preset veryfast -crf 20 -movflags +faststart video/forge-animation.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,nb_frames:format=duration -of default=nw=1 video/forge-animation.mp4 | tee -a logs.txt
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 video/forge-animation.mp4 | grep -qx h264
          ffmpeg -v error -y -ss "$(python3 -c "print($dur*0.5)")" -i video/forge-animation.mp4 -frames:v 1 video/preview.png
          ffmpeg -v error -y -i video/forge-animation.mp4 -vf "fps=2,scale=180:-2,tile=8x2" -frames:v 1 video/contact-sheet.png
          cp anim_out/scene_check.json logs.txt video/
          rm -rf anim_out/frames

      - name: Upload video artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ github.run_number }}
          path: video/
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## Animation render"
            echo "Artifact: **animation-${{ github.run_number }}** (scroll down to Artifacts to download)"
            echo '```'; grep -hE "PASS|FAIL|rig:|Render time|Frames|codec|width|height|duration|Model" logs.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Actions API is not readable from agent sessions, so results also go to the ci-results branch
      # (logs, check JSON and the small preview only; the MP4 stays an artifact).
      - name: Write results to ci-results branch
        if: always()
        env:
          STATUS: ${{ job.status }}
          ART_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          mkdir -p /tmp/ci
          cp logs.txt /tmp/ci/ 2>/dev/null || true
          cp video/scene_check.json video/preview.png video/contact-sheet.png /tmp/ci/ 2>/dev/null || true
          echo "run ${{ github.run_number }} $STATUS sha=${{ github.sha }} artifact=animation-${{ github.run_number }} id=$ART_ID" > /tmp/ci/STATUS.txt
          git fetch origin ci-results 2>/dev/null
          git worktree add -B ci-results /tmp/wt origin/ci-results 2>/dev/null || {
            git worktree add --detach /tmp/wt && cd /tmp/wt && git checkout --orphan ci-results && git rm -rqf . ; cd -; }
          d=/tmp/wt/latest/animation; rm -rf "$d" && mkdir -p "$d" && cp /tmp/ci/* "$d"/
          cd /tmp/wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Animation run ${{ github.run_number }}: $STATUS" && git push -q origin ci-results
